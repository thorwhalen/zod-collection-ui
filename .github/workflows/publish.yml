# npm auth: trusted publishing (OIDC) only. Never add an NPM_TOKEN secret.
# npmjs.com -> each package -> Settings -> Trusted Publisher -> GitHub Actions:
#   owner/repo = thorwhalen/zod-collection-ui, workflow filename = publish.yml, no environment.
name: Publish to npm

on:
  push:
    tags:
      - 'v*'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Ensure npm >= 11.5.1 (required for OIDC trusted publishing)
        run: |
          if ! node -e "const [a,b,c]=process.argv[1].split('.').map(Number);process.exit(a>11||(a===11&&(b>5||(b===5&&c>=1)))?0:1)" "$(npm --version)"; then
            npm install -g npm@^11.5.1
          fi
          npm --version
      - run: npm ci
      - run: npm run build
      - run: npm publish --access public --provenance
